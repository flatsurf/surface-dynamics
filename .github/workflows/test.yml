name: Test
on:
  push: { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.on }}
    strategy:
      matrix:
        include:
          - { environment: "dev", on: "ubuntu-26.04" }
          - { environment: "sagemath-98-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-98-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-100-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-100-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-101-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-101-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-102-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-102-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-103-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-103-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-104-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-104-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-105-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-105-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-106-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-106-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-107-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-107-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-108-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-108-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-109-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-109-all", on: "ubuntu-26.04" }
          - { environment: "sagemath-1010-minimal", on: "ubuntu-26.04" }
          - { environment: "sagemath-1010-all", on: "ubuntu-26.04" }
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: prefix-dev/setup-pixi@v0.9.3
        with: { pixi-version: v0.84.1 }
      - run: pixi run -e ${{ matrix.environment }} test-doctest-long
      - run: pixi run -e ${{ matrix.environment }} test-pytest
      - uses: flatsurf/actions/show-logs@main
        if: ${{ always() }}
